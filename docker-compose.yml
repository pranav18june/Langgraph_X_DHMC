version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dhmc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dhmc_pass}
      POSTGRES_DB: ${POSTGRES_DB:-dhmc_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhmc -d dhmc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  ui:
    build: 
      context: ./UI
      dockerfile: Dockerfile.node
    ports:
      - "5001:5001"
      - "5173:5173"
    environment:
      - NODE_ENV=development
      - PORT=5001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dhmc}:${POSTGRES_PASSWORD:-dhmc_pass}@postgres:5432/${POSTGRES_DB:-dhmc_db}
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: Dockerfile.python
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dhmc}:${POSTGRES_PASSWORD:-dhmc_pass}@postgres:5432/${POSTGRES_DB:-dhmc_db}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
